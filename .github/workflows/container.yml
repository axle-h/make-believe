# Builds the image, proves it serves both pages and relays a join, and on main pushes it to ghcr.io
# for `k8s/` to pull. Nothing is pushed that has not passed the smoke test.
name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets GITHUB_TOKEN push to ghcr.io; making the package public is a one-off in its own settings.
  packages: write

# Must equal the image `k8s/make-believe/deployment.yml` pulls.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # A `docker-container` builder: the default `docker` driver cannot export the GHA cache below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true # into the runner's docker, so the smoke test can run it
          tags: make-believe:ci
          # What `/version` answers, so phones notice this deploy.
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exactly how the Deployment runs it: non-root, no capabilities, read-only root filesystem.
      - name: Start the container the way Kubernetes will
        run: |
          docker run -d --name make-believe-ci \
            --read-only --cap-drop ALL --user 1000:1000 \
            -p 3000:3000 make-believe:ci

      - name: It serves both pages and relays a game
        timeout-minutes: 3
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "::error::/healthz never came up"; exit 1; fi
            sleep 1
          done

          # Catches a successful build with an empty `web/dist`, which serves 404s.
          host=$(curl -fsS http://localhost:3000/host/)
          case "$host" in
            *'id="world"'*) echo "the host page is there" ;;
            *) echo "::error::/host/ did not serve the TV page — the web build did not reach the image"
               printf '%s\n' "$host" | head -20; exit 1 ;;
          esac
          player=$(curl -fsS http://localhost:3000/)
          case "$player" in
            *'id="screen-join"'*) echo "the player page is there" ;;
            *) echo "::error::/ did not serve the controller page"; exit 1 ;;
          esac

          # An image answering `unknown` leaves every installed phone on its old build.
          version=$(curl -fsS http://localhost:3000/version)
          if [ "$version" != "$GITHUB_SHA" ]; then
            echo "::error::/version answered '$version', not this commit — the build version did not reach the image"
            exit 1
          fi
          echo "the image knows it is $version"

          # Node 22 has a WebSocket client built in, so this needs nothing installed.
          node --input-type=module <<'JS'
          const base = 'ws://localhost:3000/ws'
          const open = (url) => new Promise((resolve, reject) => {
            const socket = new WebSocket(url)
            socket.addEventListener('open', () => resolve(socket))
            socket.addEventListener('error', () => reject(new Error(`could not open ${url}`)))
          })
          const awaitType = (socket, type, what) => new Promise((resolve, reject) => {
            socket.addEventListener('message', (event) => {
              const message = JSON.parse(event.data)
              if (message.type === type) resolve(message)
            })
            setTimeout(() => reject(new Error(`never heard ${what}`)), 5000)
          })

          const host = await open(`${base}?role=host`)
          const hostSession = await awaitType(host, 'session', 'the session on the TV socket')
          const heard = awaitType(host, 'join', 'the join')

          const player = await open(`${base}?role=player&playerId=ci-1`)
          const playerSession = await awaitType(player, 'session', 'the session on the phone socket')
          // The relay silently drops a join missing any field, so this must keep up with
          // `JoinMessageSchema`. `#ff5d5d` is the first of `BLOB_COLOURS`.
          player.send(JSON.stringify({ type: 'join', playerId: 'ci-1', name: 'Wilf', colour: '#ff5d5d' }))

          const message = await heard
          host.close()
          player.close()
          if (!/^[A-Z2-9]{4}$/.test(hostSession.session)) {
            console.log(`::error::the relay minted '${hostSession.session}', which is not a session code`)
            process.exit(1)
          }
          if (playerSession.session !== hostSession.session) {
            console.log(`::error::the phone was told '${playerSession.session}' and the TV '${hostSession.session}'`)
            process.exit(1)
          }
          if (message.type !== 'join' || message.playerId !== 'ci-1' || message.name !== 'Wilf' || message.colour !== '#ff5d5d') {
            console.log(`::error::the host heard ${JSON.stringify(message)}, not the join`)
            process.exit(1)
          }
          console.log(`both sockets were told they are in ${hostSession.session}`)
          console.log('the relay carried a join from a player socket to the host socket')
          // An open or closing WebSocket keeps the event loop alive; without this the step hangs.
          process.exit(0)
          JS

      # Main only: a fork's pull request gets a read-only token, so this login would always fail.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          # Via the environment: `${{ }}` inside `run:` is pasted into the script before bash sees it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Pushes the image that just ran rather than rebuilding it. `latest` is what the Deployment
      # pulls; the commit tag is the one to pin or roll back to.
      - name: Push it
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag make-believe:ci "$IMAGE:latest"
          docker tag make-believe:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          echo "### Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```shell' >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl -n make-believe rollout restart deploy/make-believe" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs make-believe-ci 2>&1 | tail -50

      - name: Stop it
        if: always()
        run: docker rm -f make-believe-ci >/dev/null 2>&1 || true
