<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="A blob">
  <!--
    The blob, drawn at exactly the size and corner radius the TV gives it
    (72 units square, 14 units of corner). Transparent behind it: the icons
    script puts it on the ground colour with as much padding as each icon
    needs, and as a favicon it wants no ground at all.
  -->
  <rect width="72" height="72" rx="14" fill="#4ea8ff" />
  <g fill="#10121a">
    <circle cx="26" cy="30" r="5.5" />
    <circle cx="46" cy="30" r="5.5" />
  </g>
  <path
    d="M24 46c4.5 5.5 19.5 5.5 24 0"
    fill="none"
    stroke="#10121a"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
