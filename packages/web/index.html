<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10121a" />
    <!-- Only the player page is installable; the TV gets its own wrapper. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/blob.svg" type="image/svg+xml" />
    <title>MAKE believe — controller</title>
    <script type="module" src="/src/player/main.ts"></script>
  </head>
  <body>
    <p id="link-status" class="link-status" role="status" hidden>Reconnecting…</p>
    <main class="phone">
      <!-- The screen the page opens on, before any script has run. -->
      <section id="screen-join" class="screen">
        <h1>MAKE believe</h1>
        <!--
          The whole of getting in. There is one world, this page came from it,
          and which session of it this is gets settled on the socket.
        -->
        <p class="hint">Name your blob.</p>
        <form id="join-form" class="join-form">
          <input
            id="name-input"
            class="name-input"
            name="name"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            maxlength="16"
            placeholder="Your name"
            aria-label="Blob name"
          />
          <button id="join-button" class="button" type="submit" disabled>Join</button>
        </form>
        <p id="join-error" class="error" role="status"></p>
      </section>

      <section id="screen-waiting" class="screen" hidden>
        <h1>MAKE believe</h1>
        <p class="hint">Waiting for the TV…</p>
        <!--
          Nothing to do and nothing to press. The phone keeps trying on its
          own, and the moment a TV answers this becomes the joystick.
        -->
        <p class="waiting-detail">
          <span id="waiting-name" class="waiting-name">Blob</span> is ready.
        </p>
      </section>

      <!--
        The controller. The joystick is the whole point of it, so it gets the
        middle of the screen; saying something, redrawing your blob and renaming
        it are always one tap away along the bottom.
      -->
      <section id="screen-play" class="screen screen-play" hidden>
        <p id="play-name" class="play-name">Blob</p>
        <div id="pad" class="pad" aria-label="Joystick">
          <div id="thumb" class="thumb"></div>
        </div>
        <nav class="tools" aria-label="What else your blob can do">
          <button id="tool-say" class="tool" type="button">Say</button>
          <button id="tool-draw" class="tool" type="button">Draw</button>
          <button id="tool-name" class="tool" type="button">Name</button>
        </nav>
      </section>
    </main>

    <div id="sheet-say" class="sheet" hidden>
      <header class="sheet-head">
        <h2>Say something</h2>
        <button id="say-close" class="close" type="button" aria-label="Back to the joystick">✕</button>
      </header>
      <form id="text-form" class="text-form">
        <input
          id="text-input"
          class="text-input"
          name="say"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="sentences"
          enterkeyhint="send"
          maxlength="60"
          placeholder="Say something…"
          aria-label="What your blob says"
        />
        <p id="text-count" class="counter" aria-hidden="true">0/60</p>
        <button id="text-send" class="button" type="submit" disabled>Send</button>
      </form>
      <p id="text-sent" class="hint" role="status"></p>
    </div>

    <div id="sheet-draw" class="sheet" hidden>
      <header class="sheet-head">
        <h2>Draw your blob</h2>
        <button id="draw-close" class="close" type="button" aria-label="Back to the joystick">✕</button>
      </header>
      <canvas id="draw-canvas" class="draw-canvas" width="256" height="256"></canvas>
      <div id="draw-crayons" class="crayons" role="group" aria-label="Colours"></div>
      <div class="sheet-buttons">
        <button id="draw-clear" class="button button-quiet" type="button">Start again</button>
        <button id="draw-done" class="button" type="button">Send to the TV</button>
      </div>
      <p id="draw-status" class="hint" role="status"></p>
    </div>

    <div id="sheet-name" class="sheet" hidden>
      <header class="sheet-head">
        <h2>Name your blob</h2>
        <button id="name-close" class="close" type="button" aria-label="Back to the joystick">✕</button>
      </header>
      <form id="rename-form" class="join-form">
        <input
          id="rename-input"
          class="name-input"
          name="rename"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          maxlength="16"
          placeholder="Your name"
          aria-label="Blob name"
        />
        <button id="rename-save" class="button" type="submit" disabled>Save</button>
      </form>
      <p id="rename-status" class="hint" role="status"></p>
    </div>

  </body>
</html>
