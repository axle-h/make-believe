<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10121a" />
    <title>MAKE believe — controller</title>
    <script type="module" src="/src/player/main.ts"></script>
  </head>
  <body>
    <p id="link-status" class="link-status" role="status" hidden>Reconnecting…</p>
    <main class="phone">
      <section id="screen-join" class="screen">
        <h1>MAKE believe</h1>
        <p class="hint">Type the code on the TV and name your blob.</p>
        <form id="join-form" class="join-form">
          <input
            id="room-input"
            class="room-input"
            name="room"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="4"
            placeholder="CODE"
            aria-label="Room code"
          />
          <input
            id="name-input"
            class="name-input"
            name="name"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            maxlength="16"
            placeholder="Your name"
            aria-label="Blob name"
          />
          <button id="join-button" class="button" type="submit" disabled>Join</button>
        </form>
        <p id="join-error" class="error" role="status"></p>
      </section>

      <section id="screen-waiting" class="screen" hidden>
        <h1>MAKE believe</h1>
        <p class="hint">Waiting for the TV…</p>
        <p class="waiting-detail">
          <span id="waiting-name" class="waiting-name">Blob</span> is ready with code
          <strong id="waiting-code" class="room-code">····</strong>
        </p>
        <button id="change-code-button" class="button button-quiet" type="button">
          Use a different code
        </button>
      </section>

      <section id="screen-text" class="screen" hidden>
        <p class="hint">Say something to the TV.</p>
        <form id="text-form" class="text-form">
          <input
            id="text-input"
            class="text-input"
            name="say"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="sentences"
            enterkeyhint="send"
            maxlength="60"
            placeholder="Say something…"
            aria-label="What your blob says"
          />
          <p id="text-count" class="counter" aria-hidden="true">0/60</p>
          <button id="text-send" class="button" type="submit" disabled>Send</button>
        </form>
        <p id="text-sent" class="hint" role="status"></p>
      </section>

      <section id="screen-draw" class="screen" hidden>
        <p class="hint">Draw your blob.</p>
        <canvas id="draw-canvas" class="draw-canvas" width="256" height="256"></canvas>
        <div id="draw-crayons" class="crayons" role="group" aria-label="Colours"></div>
        <div class="draw-buttons">
          <button id="draw-clear" class="button button-quiet" type="button">Start again</button>
          <button id="draw-done" class="button" type="button">Done</button>
        </div>
        <p id="draw-status" class="hint" role="status"></p>
      </section>

      <section id="screen-play" class="screen" hidden>
        <p id="play-status" class="hint">Connecting…</p>
        <div id="pad" class="pad" aria-label="Joystick">
          <div id="thumb" class="thumb"></div>
        </div>
      </section>
    </main>
  </body>
</html>
