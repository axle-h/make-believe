# `/ws` stays open all evening, so nothing put in front of traefik may idle-time it out.
# Public, and nothing gates a join: if that must change, gate it here (basic auth, IP allowlist), not in the app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # <namespace>-<middleware>@kubernetescrd: only resolves while the namespace is `make-believe`.
    traefik.ingress.kubernetes.io/router.middlewares: make-believe-redirect-http-https@kubernetescrd
  name: make-believe
  labels:
    app: make-believe
spec:
  ingressClassName: traefik
  rules:
    - host: "believe.ax-h.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: make-believe
                port:
                  name: http
  tls:
    - hosts:
        - believe.ax-h.com
      secretName: make-believe-axh-com-tls
