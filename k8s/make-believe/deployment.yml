apiVersion: apps/v1
kind: Deployment
metadata:
  name: make-believe
  labels:
    app: make-believe
spec:
  # One replica, and Recreate: the world is in this process's memory, and two pods (even mid-rollout) would split it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: make-believe
  template:
    metadata:
      labels:
        app: make-believe
    spec:
      enableServiceLinks: false
      # The image's `USER node` is uid 1000; restated so the cluster refuses root if the image changes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: make-believe
          image: ghcr.io/axle-h/make-believe:latest
          # With `:latest`, a `rollout restart` picks up a new push; nothing watches the registry.
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The process writes nothing to disk; anything that starts to will fail here, loudly.
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit: a throttled relay shows up as laggy blobs.
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Proves the server answers, not that anybody is playing: a world with no TV is healthy.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
